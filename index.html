/* Layout: phone-first app shell — sticky header, one scrolling column, fixed bottom tab bar. Turmeric accent on cool slate, like a spice tin on a steel bench. */
:root{
  --bg:#f3f4f2; --card:#ffffff; --ink:#1d2428; --muted:#5d686e; --line:#dde1df;
  --accent:#c98a00; --accent-ink:#3a2700; --accent-soft:#f7e7bf;
  --teal:#1f6f6a; --teal-soft:#d9ecea; --good:#2f7d3b; --warn:#b5651d; --bad:#b3362c;
  --f-display:"Bricolage Grotesque", ui-rounded, system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121618; --card:#1b2124; --ink:#e8ecea; --muted:#9aa5a9; --line:#2c3438;
  --accent:#e8a817; --accent-ink:#1d1400; --accent-soft:#3a2f12;
  --teal:#5bbcb3; --teal-soft:#16302e; --good:#6cc27a; --warn:#e39a52; --bad:#ef7a6e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121618; --card:#1b2124; --ink:#e8ecea; --muted:#9aa5a9; --line:#2c3438;
  --accent:#e8a817; --accent-ink:#1d1400; --accent-soft:#3a2f12;
  --teal:#5bbcb3; --teal-soft:#16302e; --good:#6cc27a; --warn:#e39a52; --bad:#ef7a6e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);margin:0;padding:0 16px calc(88px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:12px 10px;border-bottom:1px solid var(--line);margin:0 -16px;padding-inline:16px}
header.top h1{font-size:22px;font-weight:800;flex:1;min-width:0}
header.top h1 span{color:var(--accent)}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font:600 14px var(--f-body);cursor:pointer}
main{max-width:640px;margin:0 auto;padding-block:16px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.eyebrow{font:700 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:700 14px var(--f-body);padding:7px 12px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.meter .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.meter .lbl b{color:var(--ink);font-family:var(--f-num);font-weight:500}
.bar{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:4px;position:relative}
.bar i{display:block;height:100%;background:var(--teal);border-radius:5px}
.bar.over i{background:var(--warn)} .bar.under i{background:var(--bad)}
.state{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;display:inline-block}
.state.ok{background:var(--teal-soft);color:var(--teal)} .state.lo{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)} .state.hi{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.slot{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:start}
.slot select{grid-column:1/-1;width:100%;font:16px var(--f-body);padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.slot .macro{font-size:13px;color:var(--muted)}
.ing{font-size:14px;color:var(--muted);margin:6px 0 0;padding-left:18px}
.ing li{margin:2px 0}
.btn{border:0;border-radius:12px;padding:12px 16px;font:700 15px var(--f-body);cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn:focus-visible,.iconbtn:focus-visible,select:focus-visible,input:focus-visible,.seg button:focus-visible,nav button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.opt{display:flex;flex-direction:column;gap:8px}
.opt h3{font-size:17px}
.opt ul{margin:0;padding-left:18px;font-size:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.tag.best{background:var(--accent-soft);border-color:transparent;color:var(--ink);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto}
.est{color:var(--warn);font-size:12px}
.have{opacity:.45;text-decoration:line-through}
label.chk{display:flex;gap:10px;align-items:center}
input[type=number],input[type=text]{width:100%;font:16px var(--f-num);padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
ol.steps{padding-left:22px;margin:8px 0 0} ol.steps li{margin:6px 0}
.note{font-size:13px;color:var(--muted)}
.locked{font-size:13px;color:var(--warn)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs button{border:0;background:transparent;color:var(--muted);font:700 13px var(--f-body);padding:8px 4px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.sync{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:9}
@media (max-width:380px){.meters{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>

  steps:["Oven to 220 °C. Cut the Jalsa Paneer block into 10 equal pieces and freeze the spares. Cube {paneer} (2 cm), spread on a lined tray, spray with oil and bake 15 minutes until golden at the edges.","Microwave {tvpwater} water for 4 minutes, stir in 2 tablespoons Massel liquid stock and pour over {tvp} TVP.","In the big pot with 2 seconds of oil spray, cook {onion} frozen diced onions 5 minutes. Add the soaked TVP and fry 3 minutes.","Pour in {pti} Passage To India Tikka Masala sauce, add {peas} frozen peas and {spinach} frozen spinach. Simmer 12 minutes, adding a splash of water if it gets thick.","Taste (the sauce is already seasoned) and fold in the baked paneer.","Microwave the basmati rice pouches as per the pack. Each of 7 containers: {rice:p} rice ({rice:pw} in the 2 weekend containers, labelled), then the keema. Fridge 3, freeze 4."]},
 {id:"S1",slot:"S",name:"Protein hot chocolate",ing:{milk:300,cocoa:10},stage:3,
  steps:["Microwave ½ cup of the milk for 40 seconds. Whisk in {cocoa} cocoa and 7 Natvia sticks to a smooth paste.","Whisk the paste into the rest of {milk} protein milk in a big jug.","Pour {milk:p} into each of 7 jars. Fridge 3, freeze 4. Shake, then heat 2 minutes or drink cold."]},
 {id:"S2",slot:"S",name:"Wicked Sister chocolate protein pudding",ing:{pudding:170},stage:4,steps:["No prep. Keep 7 pots in the fridge."]},
 {id:"S3",slot:"S",name:"Musashi crisp protein bar",ing:{musashi:60},stage:4,steps:["No prep. Keep 7 bars in the pantry."]},
 {id:"S4",slot:"S",name:"Protein smoothie",ing:{smoothie:400},stage:4,steps:["No prep. Keep 7 bottles in the fridge."]},
 {id:"S5",slot:"S",name:"Fudgy protein brownies",ing:{flour:16,powder:9,cocoa:6,yp_plain:37,milk:18,noegg:1},needsPowder:true,stage:1,
  steps:["Oven to 175 °C (fan-forced 155 °C). Line a 20 cm square tin.","Whisk {flour} self raising flour, {powder} protein powder, {cocoa} cocoa, {noegg} Orgran No Egg, ⅓ cup Natvia and a pinch of salt.","Stir in {yp_plain} YoPRO Plain, {milk} protein milk and the water the No Egg packet asks for, until thick and glossy.","Spread in the tin and bake 18–20 minutes; the middle should still be slightly soft.","Cool completely, then cut into 7. Fridge 3, freeze 4."]}
];
const SLOTS=[["B","Breakfast"],["L","Lunch"],["D","Dinner"],["S","Snack"]];
const RX=Object.fromEntries(R.map(r=>[r.id,r]));

/* ---------- State ---------- */
const DEFAULT={settings:{wd:1749,we:1884,p:141,f:64,c:184,mustPaneer:true,priority:"balanced",off:[]},
 plan:{B:"B2",L:"L2",D:"D2",S:"S1"},have:{},powder:{name:"",kj:"",p:"",f:"",c:"",price:"",size:""},tab:"plan",day:"wd"};
let S=structuredClone(DEFAULT);
function load(){try{const j=JSON.parse(localStorage.getItem("sbp")||"null");if(j)S=merge(DEFAULT,j);}catch(e){}}
function merge(a,b){const o=structuredClone(a);for(const k in b){if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&o[k]&&typeof o[k]==="object")o[k]={...o[k],...b[k]};else o[k]=b[k];}return o}
let dbRef=null,saveT=null,writing=false,pending=false;
function save(){try{localStorage.setItem("sbp",JSON.stringify(S));}catch(e){}
 }
async function pushDb(){if(!dbRef)return;if(writing){pending=true;return}writing=true;
 try{await dbRef.set({state:JSON.stringify(S),v:1});setSync("Synced to your account");}catch(e){setSync("Saved on this phone")}
 writing=false;if(pending){pending=false;pushDb()}}
function setSync(t){document.getElementById("sync").textContent=t}

/* ---------- Maths ---------- */
function prod(pid){const x=P[pid];if(pid==="powder"){const w=S.powder;return{...x,n:w.name||"Your protein powder",kj:+w.kj||0,p:+w.p||0,f:+w.f||0,c:+w.c||0,price:+w.price||0,pack:+w.size||1000}}return x}
const powderReady=()=>+S.powder.kj>0&&+S.powder.p>0;
function mac(pid,g){const x=prod(pid);return{k:x.kj*g/100/4.184,p:x.p*g/100,f:x.f*g/100,c:x.c*g/100}}
function add(a,b){return{k:a.k+b.k,p:a.p+b.p,f:a.f+b.f,c:a.c+b.c}}
const Z=()=>({k:0,p:0,f:0,c:0});
function portion(r,flexG){let t=Z();for(const pid in r.ing){const g=(r.flex&&r.flex.pid===pid&&flexG!=null)?flexG:r.ing[pid];t=add(t,mac(pid,g))}return t}
function grams(r,flexG){const o={...r.ing};if(r.flex&&flexG!=null)o[r.flex.pid]=flexG;return o}
/* fit flex ingredients so the day lands near the calorie target */
function fit(ids,target){const rs=ids.map(id=>RX[id]);const fx=rs.map(r=>r.flex?r.ing[r.flex.pid]:null);
 const tot=()=>rs.reduce((t,r,i)=>add(t,portion(r,fx[i])),Z());
 for(let n=0;n<60;n++){const cur=tot();const diff=target-cur.k;let best=null,bestAbs=Math.abs(diff);
  rs.forEach((r,i)=>{if(!r.flex)return;const dir=diff>0?1:-1;const ng=fx[i]+dir*r.flex.step;if(ng<r.flex.min-1e-6||ng>r.flex.max+1e-6)return;
   const nk=cur.k+(mac(r.flex.pid,ng).k-mac(r.flex.pid,fx[i]).k);const a=Math.abs(target-nk);if(a<bestAbs-0.5){bestAbs=a;best=[i,ng]}});
  if(!best)break;fx[best[0]]=best[1]}
 return{fx,tot:tot()}}
function dayPlan(plan,dt){const ids=SLOTS.map(([s])=>plan[s]);const target=dt==="wd"?S.settings.wd:S.settings.we;return fit(ids,target)}
function available(r){return !S.settings.off.includes(r.id)&&(!r.needsPowder||powderReady())}
function weekly(plan){const wd=dayPlan(plan,"wd"),we=dayPlan(plan,"we");const need={};const per={};
 SLOTS.forEach(([s],i)=>{const r=RX[plan[s]];const gw=grams(r,wd.fx[i]),ge=grams(r,we.fx[i]);per[r.id]={wd:gw,we:ge,wk:{}};
  for(const pid in r.ing){const w=5*gw[pid]+2*ge[pid];per[r.id].wk[pid]=w;need[pid]=(need[pid]||0)+w}});
 return{need,per,wd,we}}
function shop(plan){const {need}=weekly(plan);let buy=0,avg=0,est=false;const rows=Object.entries(need).map(([pid,g])=>{const x=prod(pid);const packs=Math.max(1,Math.ceil(g/x.pack-0.03));const have=!!S.have[pid];
  const cost=have?0:packs*x.price;buy+=cost;avg+=x.price*g/x.pack;if(x.est&&!have)est=true;return{pid,x,g,packs,cost,have,left:packs*x.pack-g}});
 rows.sort((a,b)=>a.x.n.localeCompare(b.x.n));return{rows,buy,avg,est}}
function score(plan){const w=dayPlan(plan,"wd"),e=dayPlan(plan,"we");const st=S.settings;let s=0;
 for(const [d,t] of [[w,st.wd],[e,st.we]]){s+=Math.abs(d.tot.k-t)/t*100;if(d.tot.p<st.p)s+=(st.p-d.tot.p)*2;if(d.tot.f>st.f*1.15)s+=(d.tot.f-st.f*1.15)*0.3;}
 const c=shop(plan).avg;const wt={macros:0.05,balanced:0.35,cheap:1.2}[st.priority]||0.35;return{s:s+c*wt,w,e,c}}
function combos(){const by=s=>R.filter(r=>r.slot===s&&available(r));const out=[];
 for(const b of by("B"))for(const l of by("L"))for(const d of by("D"))for(const sn of by("S")){const plan={B:b.id,L:l.id,D:d.id,S:sn.id};
  if(S.settings.mustPaneer&&![b,l,d,sn].some(r=>r.ing.paneer))continue;out.push({plan,...score(plan)})}
 return out.sort((a,b)=>a.s-b.s)}

/* ---------- Formatting ---------- */
const FR=[[0,""],[.25,"¼"],[1/3,"⅓"],[.5,"½"],[2/3,"⅔"],[.75,"¾"],[1,""]];
function frac(x){const w=Math.floor(x+1e-9);let r=x-w;let best=FR[0],bd=9;for(const f of FR){const d=Math.abs(r-f[0]);if(d<bd){bd=d;best=f}}
 const whole=best[0]===1?w+1:w;const s=(whole?String(whole):"")+best[1];return s||"0"}
function amt(pid,g){const x=prod(pid),m=x.m;const gr=Math.round(g);
 if(m.each){const n=Math.round(g/m.each*2)/2;return `${frac(n)} ${n===1?m.one:m.many}`}
 if(m.pack){const n=g/x.pack;if(Math.abs(n-Math.round(n))<0.06&&Math.round(n)>0)return `${Math.round(n)} ${Math.round(n)===1?"pack":"packs"} (${gr} g)`;return `${frac(Math.round(n*4)/4)} of a pack (~${gr} g)`}
 if(m.tsp){const n=Math.round(g/m.tsp*2)/2;return `${frac(n)} teaspoon${n>1?"s":""}`}
 if(m.tbsp){const n=Math.round(g/m.tbsp*2)/2;return n>=8?`${frac(n/16)} cup (~${gr} g)`:`${frac(n)} tablespoon${n>1?"s":""}`}
 if(m.cup){const c=g/m.cup;if(c<0.24){const t=Math.round(c*16*2)/2;return `${frac(t)} tablespoon${t>1?"s":""}`}return `${frac(c)} cup${c>1.1?"s":""} (~${gr} g)`}
 return `${gr} g`}
const r0=n=>Math.round(n),r1=n=>Math.round(n*10)/10;
const money=n=>"$"+n.toFixed(2);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fillSteps(r,per){return r.steps.map(t=>t.replace(/\{(\w+)(?::(pw|p))?\}/g,(_,pid,mode)=>{
  if(pid==="tvpwater"){const g=per.wk.tvp||0;return amt("milk",g*2)}
  if(!(pid in per.wk))return "";return amt(pid,mode==="p"?per.wd[pid]:mode==="pw"?per.we[pid]:per.wk[pid])}))}

/* ---------- Views ---------- */
const app=document.getElementById("app");
function meter(label,v,t,kind){const pct=Math.min(130,v/t*100);let cls="",st="ok",txt="On target";
 if(kind==="min"){if(v<t){cls="under";st="lo";txt=`${r0(t-v)} g short`}else txt="Above minimum"}
 else{const d=v-t;if(Math.abs(d)/t>0.06){cls=d>0?"over":"under";st=d>0?"hi":"lo";txt=(d>0?"+":"")+r0(d)+(label==="Calories"?" kcal":" g")}}
 return `<div class="meter"><div class="lbl"><span>${label}</span><b>${r0(v)} / ${r0(t)}${label==="Calories"?"":" g"}</b></div><div class="bar ${cls}"><i style="width:${Math.min(100,pct)}%"></i></div><span class="state ${st}">${txt}</span></div>`}
function planView(){const dt=S.day;const d=dayPlan(S.plan,dt);const st=S.settings;const t=dt==="wd"?st.wd:st.we;const sh=shop(S.plan);
 let h=`<section class="card"><div class="row" style="justify-content:space-between"><div><div class="eyebrow">This week's plan</div><h2 style="font-size:20px">${dt==="wd"?"Weekday":"Weekend"} totals</h2></div>
 <div class="seg" role="group" aria-label="Day type"><button type="button" data-day="wd" aria-pressed="${dt==="wd"}">Weekday</button><button type="button" data-day="we" aria-pressed="${dt==="we"}">Weekend</button></div></div>
 <div class="meters">${meter("Calories",d.tot.k,t)}${meter("Protein",d.tot.p,st.p,"min")}${meter("Fat",d.tot.f,st.f)}${meter("Carbs",d.tot.c,st.c)}</div>
 <p class="note" style="margin:10px 0 0">Shop this week: <b class="num">${money(sh.buy)}</b>${sh.est?' <span class="est">includes estimated prices</span>':""}</p></section>`;
 SLOTS.forEach(([s,label],i)=>{const r=RX[S.plan[s]];const g=grams(r,d.fx[i]);const m=portion(r,d.fx[i]);
  const opts=R.filter(x=>x.slot===s).map(x=>`<option value="${x.id}" ${x.id===r.id?"selected":""} ${available(x)||x.id===r.id?"":"disabled"}>${esc(x.name)}${x.needsPowder&&!powderReady()?" (add protein powder in Settings)":""}</option>`).join("");
  h+=`<section class="card slot"><div><div class="eyebrow">${label}</div><h3 style="font-size:18px">${esc(r.name)}</h3></div>
  <div class="macro num" style="text-align:right">${r0(m.k)} kcal<br>${r1(m.p)} g protein</div>
  <ul class="ing" style="grid-column:1/-1">${Object.keys(g).map(pid=>`<li>${esc(prod(pid).n)}: ${amt(pid,g[pid])}</li>`).join("")}</ul>
  <label class="eyebrow" for="sel-${s}" style="grid-column:1/-1;margin-top:6px">Swap ${label.toLowerCase()}</label>
  <select id="sel-${s}" data-slot="${s}">${opts}</select></section>`});
 return h}
function optionsView(){const list=combos().slice(0,6);const st=S.settings;
 if(!list.length)return `<section class="card"><h2>No combinations fit</h2><p class="note">Turn some recipes back on in Settings, or untick “Must include paneer”.</p></section>`;
 let h=`<section class="card"><div class="eyebrow">Ranked for you</div><h2 style="font-size:20px">Best-fitting weeks</h2>
 <p class="note" style="margin:6px 0 0">Ranked by how close each week lands to ${st.wd} kcal weekdays, ${st.we} kcal weekends and at least ${st.p} g protein${st.priority==="cheap"?", weighted toward the lowest cost":st.priority==="macros"?", ignoring cost":", balanced against cost"}.</p></section>`;
 list.forEach((o,i)=>{const cur=SLOTS.every(([s])=>S.plan[s]===o.plan[s]);
  h+=`<section class="card opt"><div class="tags">${i===0?'<span class="tag best">Best fit</span>':""}${cur?'<span class="tag">Your current plan</span>':""}<span class="tag num">~${money(o.c)}/week</span></div>
  <ul>${SLOTS.map(([s,l])=>`<li><b>${l}:</b> ${esc(RX[o.plan[s]].name)}</li>`).join("")}</ul>
  <div class="note num">Weekday ${r0(o.w.tot.k)} kcal · ${r0(o.w.tot.p)} g protein · Weekend ${r0(o.e.tot.k)} kcal · ${r0(o.e.tot.p)} g protein</div>
  ${cur?"":`<button class="btn" type="button" data-pick="${i}">Use this week</button>`}</section>`});
 optionsView.list=list;return h}
function shopView(){const sh=shop(S.plan);
 let h=`<section class="card"><div class="eyebrow">Woolworths list</div><h2 style="font-size:20px">Shopping for 7 days</h2>
 <p class="note" style="margin:6px 0 0">This shop: <b class="num">${money(sh.buy)}</b> · Average per week once leftovers carry over: <b class="num">${money(sh.avg)}</b>${sh.est?'<br><span class="est">Prices marked “est.” weren’t shown online; check in store.</span>':""}</p>
 <div class="row" style="margin-top:10px"><button class="btn" type="button" id="copyList">Copy list</button><span class="note">Tick items you already have.</span></div></section>
 <section class="card scroll"><table><thead><tr><th>Have</th><th>Product</th><th class="r">Buy</th><th class="r">Cost</th></tr></thead><tbody>`;
 sh.rows.forEach(r=>{h+=`<tr class="${r.have?"have":""}"><td><input type="checkbox" aria-label="Already have ${esc(r.x.n)}" data-have="${r.pid}" ${r.have?"checked":""}></td>
 <td>${r.x.id?`<a href="${WW+r.x.id}" target="_blank" rel="noopener" style="color:inherit">${esc(r.x.n)}</a>`:esc(r.x.n)} <span class="note">${esc(r.x.size)}</span><br><span class="note">Uses ${amt(r.pid,r.g)}${r.left>r.x.pack*0.15?` · ${Math.round(r.left)} g left over`:""}</span></td>
 <td class="r num">${r.packs}</td><td class="r num">${r.have?"–":money(r.cost)}${r.x.est&&!r.have?'<br><span class="est">est.</span>':""}</td></tr>`});
 h+=`</tbody></table><p class="note">Pantry staples not listed: Massel liquid stock, spices, minced garlic, Natvia, oil spray, chilli add-ons.</p></section>`;return h}
function cookView(){const w=weekly(S.plan);const rs=SLOTS.map(([s])=>RX[S.plan[s]]).sort((a,b)=>a.stage-b.stage);
 const oven=rs.filter(r=>r.stage===1).map(r=>r.name),stove=rs.filter(r=>r.stage===2).map(r=>r.name);
 let h=`<section class="card"><div class="eyebrow">Sunday batch</div><h2 style="font-size:20px">Cook order</h2>
 <ol class="steps"><li>Turn the oven on first${oven.length?` for ${esc(oven.join(" and "))}`:""}, and put a big pot of water on the induction.</li>
 <li>Start any TVP soaks in the microwave while the oven heats.</li>
 <li>Oven trays in, then pasta on the induction${stove.length?` for ${esc(stove.join(" and "))}`:""}. Konjac goes in the microwave while the pasta boils.</li>
 <li>While sauces simmer, make the jars (breakfast and snack).</li>
 <li>Portion into containers, cool 30 minutes with lids ajar, then fridge Mon–Wed and freeze Thu–Sun.</li></ol></section>`;
 rs.forEach(r=>{h+=`<section class="card"><div class="eyebrow">${SLOTS.find(s=>s[0]===r.slot)[1]} · 7 portions</div><h3 style="font-size:18px">${esc(r.name)}</h3>
 <ol class="steps">${fillSteps(r,w.per[r.id]).map(s=>`<li>${esc(s)}</li>`).join("")}</ol></section>`});return h}
function settingsView(){const st=S.settings,pw=S.powder;
 const num=(id,v,l)=>`<label>${l}<input type="number" inputmode="decimal" id="${id}" value="${esc(v)}"></label>`;
 let h=`<section class="card"><div class="eyebrow">Settings</div><h2 style="font-size:20px">Targets</h2><div class="grid2" style="margin-top:10px">
 ${num("s-wd",st.wd,"Weekday kcal")}${num("s-we",st.we,"Weekend kcal")}${num("s-p",st.p,"Protein minimum (g)")}${num("s-f",st.f,"Fat (g)")}${num("s-c",st.c,"Carbs (g)")}</div>
 <label class="chk" style="margin-top:12px"><input type="checkbox" id="s-paneer" ${st.mustPaneer?"checked":""}> Must include paneer</label>
 <div class="eyebrow" style="margin-top:12px">Rank options by</div><div class="seg" role="group" aria-label="Ranking">${[["macros","Macros"],["balanced","Balanced"],["cheap","Cheapest"]].map(([k,l])=>`<button type="button" data-prio="${k}" aria-pressed="${st.priority===k}">${l}</button>`).join("")}</div></section>
 <section class="card"><h2 style="font-size:18px">Your protein powder</h2><p class="note">Copy the per-100 g column from your tub. This unlocks the pancake slab and brownies.</p>
 <label class="note" for="pw-name">Name</label><input type="text" id="pw-name" value="${esc(pw.name)}" placeholder="Brand and flavour">
 <div class="grid2" style="margin-top:10px">${num("pw-kj",pw.kj,"Energy kJ /100 g")}${num("pw-p",pw.p,"Protein g /100 g")}${num("pw-f",pw.f,"Fat g /100 g")}${num("pw-c",pw.c,"Carbs g /100 g")}${num("pw-size",pw.size,"Tub size (g)")}${num("pw-price",pw.price,"Tub price ($)")}</div></section>
 <section class="card"><h2 style="font-size:18px">Recipes I'll eat</h2><p class="note">Untick anything you don't want suggested.</p>
 ${SLOTS.map(([s,l])=>`<div class="eyebrow" style="margin-top:10px">${l}</div>`+R.filter(r=>r.slot===s).map(r=>`<label class="chk" style="margin:6px 0"><input type="checkbox" data-on="${r.id}" ${st.off.includes(r.id)?"":"checked"}> ${esc(r.name)}${r.needsPowder&&!powderReady()?' <span class="locked">needs powder label</span>':""}</label>`).join("")).join("")}</section>
 <button class="btn ghost" type="button" data-tab="plan">Done</button>`;return h}

function render(){const v={plan:planView,options:optionsView,shop:shopView,cook:cookView,settings:settingsView}[S.tab]||planView;app.innerHTML=v();
 document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===S.tab?"page":"false"))}
function go(tab){S.tab=tab;save();render();window.scrollTo(0,0)}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,1800)}

document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.tab)go(b.dataset.tab);
 if(b.id==="openSettings")go("settings");
 if(b.dataset.day){S.day=b.dataset.day;save();render()}
 if(b.dataset.prio){S.settings.priority=b.dataset.prio;save();render()}
 if(b.dataset.pick){const o=optionsView.list[+b.dataset.pick];S.plan={...o.plan};S.tab="plan";save();render();toast("Plan updated")}
 if(b.id==="copyList"){const sh=shop(S.plan);const txt=sh.rows.filter(r=>!r.have).map(r=>`${r.packs} × ${r.x.n} ${r.x.size}`).join("\n")+`\nTotal ≈ ${money(sh.buy)}`;
  try{navigator.clipboard.writeText(txt).then(()=>toast("Copied"),()=>toast("Couldn't copy"))}catch(err){toast("Couldn't copy")}}
});
document.addEventListener("change",e=>{const t=e.target;
 if(t.dataset.slot){S.plan[t.dataset.slot]=t.value;save();render();return}
 if(t.dataset.have){S.have[t.dataset.have]=t.checked;save();render();return}
 if(t.dataset.on){const id=t.dataset.on;S.settings.off=S.settings.off.filter(x=>x!==id);if(!t.checked)S.settings.off.push(id);save();return}
 if(t.id==="s-paneer"){S.settings.mustPaneer=t.checked;save();return}
 const map={"s-wd":"wd","s-we":"we","s-p":"p","s-f":"f","s-c":"c"};if(map[t.id]){const v=+t.value;if(v>0){S.settings[map[t.id]]=v;save()}return}
 if(t.id&&t.id.startsWith("pw-")){S.powder[t.id.slice(3)]=t.value;save();return}
});
load();render();
</script>
